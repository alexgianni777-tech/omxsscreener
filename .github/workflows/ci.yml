name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Integration tests must use a disposable local database, never Replit's.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize ephemeral CI schema
        run: pnpm --filter @workspace/db exec drizzle-kit push --config ./drizzle.config.ts

      - name: Run API tests
        run: pnpm --filter @workspace/api-server run test

      - name: Run screener tests
        run: pnpm --filter @workspace/screener run test

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Check Drizzle migrations
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm --filter @workspace/db run check

      - name: Build production artifacts
        run: pnpm run build:production
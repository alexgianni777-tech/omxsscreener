kind = "web"
previewPath = "/"
title = "OMXS30 Screener"
description = "A daily stock screener dashboard for OMXS30. Users paste the raw screener text output each day to import candidates across categories (Momentum, Squeeze, Studs, Weakest), browse setups with entry/stop/target details, and log trade outcomes over time."
version = "1.0.0"
id = "artifacts/screener"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20427

[services.development]
run = "pnpm --filter @workspace/screener run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/screener", "run", "build" ]
serve = "static"
publicDir = "artifacts/screener/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20427"
BASE_PATH = "/"

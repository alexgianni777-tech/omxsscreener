[build]
  builder = "nixpacks"
  buildCommand = "npm install -g pnpm@latest && pnpm install --frozen-lockfile && pnpm run build:production"

[deploy]
  startCommand = "pnpm --filter @workspace/db run push && node artifacts/api-server/dist/index.mjs"
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: OMXS30 Screener API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Screener sessions
  - name: candidates
    description: Stock candidates
  - name: dashboard
    description: Dashboard aggregates
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /screener/sessions/import:
    post:
      operationId: importSession
      tags: [sessions]
      summary: Import raw screener text and parse into a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionImport"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "200":
          description: Session updated (force re-import)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "400":
          description: Parse error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session for this date already exists — includes logged outcomes that would be preserved on force re-import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportConflict"

  /screener/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List all screener sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"

  /screener/sessions/{id}/reimport:
    put:
      operationId: reimportSession
      tags: [sessions]
      summary: Re-import raw screener text into an existing session, preserving logged outcomes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionImport"
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "400":
          description: Parse error or date mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /screener/sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session with all its candidates
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a screener session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List candidates with optional filters
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [MOMENTUM, SQUEEZE, STUDS, WEAKEST]
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [WIN, LOSS, SKIP, PENDING]
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [LONG, SHORT]
      responses:
        "200":
          description: List of candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CandidateWithSession"

  /candidates/{id}/outcome:
    patch:
      operationId: updateCandidateOutcome
      tags: [candidates]
      summary: Log the trade outcome for a candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateOutcome"
      responses:
        "200":
          description: Updated candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /screener/quotes:
    get:
      operationId: getQuotes
      tags: [sessions]
      summary: Fetch live prices from Yahoo Finance for a list of tickers
      parameters:
        - name: tickers
          in: query
          required: true
          schema:
            type: string
            description: Comma-separated list of screener tickers (e.g. SSAB-B,ERIC-B)
      responses:
        "200":
          description: Live quote data per ticker
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteResult"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Overall stats — session counts, win rate, R/R by category
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /portfolio:
    get:
      operationId: getPortfolio
      tags: [portfolio]
      summary: Open positions enriched with valuation, stop risk, and exposure
      responses:
        "200":
          description: Portfolio positions and aggregate risk summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to OIDC logout with post-logout redirect.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    PortfolioPosition:
      type: object
      required: [id, ticker, instrument, direction, market, notes, entryPrice, lastPrice, stopPrice, targetPrice, shares, positionSizeKr, risk1R, riskToStopKr, riskToStopPct, stopPnlKr, stopPnlPct, createdAt, livePrice, changePct, quoteAsOf, unrealisedPct, unrealisedKr, currentR, marketValueKr, distToStop, distToTarget]
      properties:
        id: { type: number }
        ticker: { type: string }
        instrument: { type: ["string", "null"] }
        direction: { type: string, enum: [LONG, SHORT] }
        market: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        entryPrice: { type: number }
        lastPrice: { type: ["number", "null"] }
        stopPrice: { type: ["number", "null"] }
        targetPrice: { type: ["number", "null"] }
        shares: { type: number }
        positionSizeKr: { type: number }
        risk1R: { type: ["number", "null"], description: Entry-to-stop risk in SEK; retained for compatibility. }
        riskToStopKr: { type: ["number", "null"], description: Maximum loss in SEK from entry to a protective stop; null when no protective stop is set. }
        riskToStopPct: { type: ["number", "null"], description: Maximum loss from entry to a protective stop, as a percentage of entry value. }
        stopPnlKr: { type: ["number", "null"], description: Signed P&L in SEK if the position exits at its stop; null when no stop is set. }
        stopPnlPct: { type: ["number", "null"], description: Signed P&L at stop as a percentage of entry value; null when no stop is set. }
        createdAt: { type: string, format: date-time }
        livePrice: { type: ["number", "null"] }
        changePct: { type: ["number", "null"] }
        quoteAsOf: { type: ["string", "null"], format: date-time }
        unrealisedPct: { type: ["number", "null"] }
        unrealisedKr: { type: ["number", "null"] }
        currentR: { type: ["number", "null"] }
        marketValueKr: { type: ["number", "null"] }
        distToStop: { type: ["number", "null"] }
        distToTarget: { type: ["number", "null"] }

    PortfolioSummary:
      type: object
      required: [count, totalInvestedKr, totalMarketValueKr, totalUnrealisedKr, totalUnrealisedPct, maxStopLossKr, longExposureKr, shortExposureKr, grossExposureKr, netExposureKr]
      properties:
        count: { type: number }
        totalInvestedKr: { type: number }
        totalMarketValueKr: { type: number }
        totalUnrealisedKr: { type: number }
        totalUnrealisedPct: { type: number }
        maxStopLossKr:
          type: ["number", "null"]
          description: Sum of negative stop P&L amounts only. Null when any open position lacks a stop, because maximum stop loss is then undefined.
        longExposureKr: { type: number, description: Current long market exposure. }
        shortExposureKr: { type: number, description: Current short market exposure, reported as a positive amount. }
        grossExposureKr: { type: number, description: Long exposure plus short exposure. }
        netExposureKr: { type: number, description: Long exposure minus short exposure. }

    PortfolioResponse:
      type: object
      required: [positions, summary, fetchedAt]
      properties:
        positions:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioPosition"
        summary:
          $ref: "#/components/schemas/PortfolioSummary"
        fetchedAt:
          type: string
          format: date-time

    SessionConflictError:
      type: object
      required: [error, existingSessionId]
      properties:
        error:
          type: string
        existingSessionId:
          type: number
          description: ID of the existing session for this date

    SessionImport:
      type: object
      required: [rawText]
      properties:
        rawText:
          type: string
          description: The raw text output from the screener
        targetDate:
          type: string
          format: date
          description: Optional trading-session date. The date inside rawText remains the source-data date.
        force:
          type: boolean
          description: If true, replace the existing session for this date while preserving logged outcomes

    AffectedOutcome:
      type: object
      required: [ticker, category, outcome]
      properties:
        ticker:
          type: string
        category:
          type: string
          enum: [MOMENTUM, SQUEEZE, STUDS, WEAKEST]
        outcome:
          type: string
          enum: [WIN, LOSS, SKIP]
        exitPrice:
          type: ["number", "null"]

    ImportConflict:
      type: object
      required: [error, sessionId, date, affectedOutcomes]
      properties:
        error:
          type: string
        sessionId:
          type: number
        date:
          type: string
        affectedOutcomes:
          type: array
          items:
            $ref: "#/components/schemas/AffectedOutcome"
        wouldRemove:
          type: array
          description: Still-pending candidates (no logged outcome) that are not present in the new import and would be deleted on a force re-import. Logged outcomes are never deleted.
          items:
            $ref: "#/components/schemas/RemovedCandidatePreview"

    RemovedCandidatePreview:
      type: object
      required: [ticker, category, direction]
      properties:
        ticker:
          type: string
        category:
          type: string
          enum: [MOMENTUM, SQUEEZE, STUDS, WEAKEST]
        direction:
          type: string
          enum: [LONG, SHORT]
        market:
          type: string
          enum: [SE, US]

    MarketWeather:
      type: object
      required: [omxsValue, perf5d, perf1m, perf3m, rsi, trendLabel]
      properties:
        omxsValue:
          type: number
        perf5d:
          type: number
        perf1m:
          type: number
        perf3m:
          type: number
        rsi:
          type: number
        trendLabel:
          type: string

    Candidate:
      type: object
      required: [id, sessionId, category, rank, ticker, price, rs3m, perf1m, rsi, pctB, atr, volMultiplier, distFrom20dH, direction, entryPrice, stopPrice, targetPrice, rr, oneR, outcome]
      properties:
        id:
          type: number
        sessionId:
          type: number
        category:
          type: string
          enum: [MOMENTUM, SQUEEZE, STUDS, WEAKEST]
        rank:
          type: number
        ticker:
          type: string
        price:
          type: number
        rs3m:
          type: number
        perf1m:
          type: number
        rsi:
          type: number
        pctB:
          type: number
        atr:
          type: number
        volMultiplier:
          type: number
        volumeAsOf:
          type: ["string", "null"]
          description: "YYYY-MM-DD completed Yahoo trading day used for relative volume; null for unverified or legacy measurements"
        earningsInDays:
          type: ["number", "null"]
          description: "Days to earnings only when earningsKnowledge is SIGNAL_TIME; otherwise not assessable"
        earningsKnowledge:
          type: string
          enum: [SIGNAL_TIME, UNKNOWN]
          description: "Whether Rule 7 has a verified observation from the signal date"
        earningsObservedAt:
          type: ["string", "null"]
          format: date-time
          description: "When the Yahoo earnings calendar was observed for the stored signal-time value"
        signalRsi:
          type: ["number", "null"]
          description: "Wilder RSI(14) calculated from the signal chart when available"
        signalGapPct:
          type: ["number", "null"]
          description: "Opening gap from previous close in percent when available"
        edgeWinRate:
          type: ["number", "null"]
          description: "EdgeAI historical win rate as a fraction, separate from one-month price performance"
        edgeExpectancyR:
          type: ["number", "null"]
          description: "EdgeAI expected R per trade, separate from RSI"
        edgeSampleN:
          type: ["number", "null"]
          description: "Number of observations behind the EdgeAI estimate"
        signalAgeBars:
          type: ["number", "null"]
          description: "Trading bars elapsed since the signal trigger"
        maxHoldDays:
          type: ["number", "null"]
          description: "Maximum intended holding period in trading days"
        distFrom20dH:
          type: number
        gapWarning:
          type: ["number", "null"]
        market:
          type: string
          enum: [SE, US]
          description: "Origin market for the signal: SE or US"
        signalSource:
          type: ["string", "null"]
          enum: [edgeai, telegram, manual, screener, null]
          description: "Provenance of this individual signal; session source is only a legacy fallback."
        direction:
          type: string
          enum: [LONG, SHORT]
        entryPrice:
          type: number
        stopPrice:
          type: number
        targetPrice:
          type: number
        rr:
          type: number
        oneR:
          type: number
        outcome:
          type: string
          enum: [WIN, LOSS, TIME_EXIT, SKIP, PENDING]
        exitPrice:
          type: ["number", "null"]
        outcomeNotes:
          type: ["string", "null"]
        resolutionMethod:
          type: ["string", "null"]
          enum: [MANUAL_EXIT, TARGET_HIT, STOP_HIT, TIME_EXIT, null]
          description: "How the outcome was resolved. MANUAL_EXIT and TIME_EXIT require a recorded exit price; TARGET_HIT and STOP_HIT are explicit planned-level assumptions."
        resolutionQuality:
          type: ["string", "null"]
          enum: [RECORDED_EXIT, ASSUMED_LEVEL, LEGACY_UNKNOWN, null]
          description: "Confidence/provenance of the resolution. Null is retained for legacy rows."
        realizedR:
          type: ["number", "null"]
          description: "Signed realized R, calculated from the recorded or assumed exit price and the original entry/stop risk."
        resolutionEntryPrice:
          type: ["number", "null"]
          description: "Immutable entry price captured on first resolution; used as the realized-R numerator baseline."
        resolutionStopPrice:
          type: ["number", "null"]
          description: "Immutable stop price captured on first resolution; used as the realized-R denominator baseline."
        resolutionDirection:
          type: ["string", "null"]
          enum: [LONG, SHORT, null]
          description: "Immutable direction captured on first resolution."
        hasLinkedTrade:
          type: boolean
          description: "Whether a Challenge Tracker trade is linked to this candidate's outcome"
        review:
          $ref: "#/components/schemas/SignalReview"
        decision:
          $ref: "#/components/schemas/CandidateDecision"

    SignalReview:
      type: object
      required: [status, reasons]
      properties:
        status:
          type: string
          enum: [APPROVED, WARN, BLOCKED]
        reasons:
          type: array
          items:
            type: string

    CandidateDecision:
      type: object
      required: [status, reasons]
      properties:
        status:
          type: string
          enum: [TRADEABLE, WAIT, BLOCKED, INVALID, STALE]
        reasons:
          type: array
          items:
            type: string

    SessionReview:
      allOf:
        - $ref: "#/components/schemas/SignalReview"
        - type: object
          required: [tradableCount]
          properties:
            tradableCount:
              type: number

    CandidateWithSession:
      allOf:
        - $ref: "#/components/schemas/Candidate"
        - type: object
          required: [sessionDate]
          properties:
            sessionDate:
              type: string
              description: "YYYY-MM-DD"

    CandidateOutcome:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [WIN, LOSS, TIME_EXIT, SKIP, PENDING]
        exitPrice:
          type: ["number", "null"]
        outcomeNotes:
          type: ["string", "null"]
        resolutionMethod:
          type: ["string", "null"]
          enum: [MANUAL_EXIT, TARGET_HIT, STOP_HIT, TIME_EXIT, null]
          description: "TIME_EXIT and MANUAL_EXIT are accepted only with actualExitConfirmed=true and an entered fill price."
        actualExitConfirmed:
          type: boolean
          description: "Explicit confirmation that exitPrice is an entered, executed fill. A Yahoo/live quote alone must not set this."
        challengeTrade:
          $ref: "#/components/schemas/CandidateChallengeTrade"
        removeChallengeTrade:
          type: boolean
          description: "Explicitly remove an existing linked Challenge Tracker trade when reverting to PENDING or SKIP."

    CandidateChallengeTrade:
      type: object
      required: [date, ticker, strategy, direction, pnlKr, flag, followedPlan]
      properties:
        date:
          type: string
          format: date
          description: "Validated against and persisted from the candidate session date."
        ticker:
          type: string
          maxLength: 32
          description: "Validated against and persisted from the candidate ticker."
        strategy:
          type: string
          maxLength: 120
        direction:
          type: string
          enum: [LONG, SHORT]
          description: "Validated against and persisted from the candidate direction."
        pnlKr:
          type: number
          description: "Validated against realized R and riskAllocationKr; retained for older clients."
        riskAllocationKr:
          type: number
          exclusiveMinimum: 0
          description: "Cash allocated to one R. The server derives P&L as round(riskAllocationKr × realizedR)."
        flag:
          type: string
          enum: [LAST, REFLEX]
        followedPlan:
          type: boolean
        boughtBeforeReport:
          type: boolean

    SessionSummary:
      type: object
      required: [id, date, marketWeather, momentumCount, squeezeCount, studsCount, weakestCount, totalCandidates, trackedCount]
      properties:
        id:
          type: number
        date:
          type: string
          description: "YYYY-MM-DD"
        marketWeather:
          $ref: "#/components/schemas/MarketWeather"
        momentumCount:
          type: number
        squeezeCount:
          type: number
        studsCount:
          type: number
        weakestCount:
          type: number
        totalCandidates:
          type: number
        trackedCount:
          type: number
          description: Number of candidates with a non-PENDING outcome

    SessionDetail:
      type: object
      required: [id, date, marketWeather, candidates, source, createdAt, lastImportAt]
      properties:
        id:
          type: number
        date:
          type: string
          description: "YYYY-MM-DD"
        source:
          type: ["string", "null"]
          description: "Import provenance, such as edgeai, telegram, or mixed."
        createdAt:
          type: ["string", "null"]
          format: date-time
        lastImportAt:
          type: ["string", "null"]
          format: date-time
        edgeRegime:
          type: ["object", "null"]
          additionalProperties: true
        edgeExpectancy:
          type: ["number", "null"]
        edgeWinRate:
          type: ["number", "null"]
        edgePF:
          type: ["number", "null"]
        edgeN:
          type: ["number", "null"]
        marketWeather:
          $ref: "#/components/schemas/MarketWeather"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        sessionReview:
          $ref: "#/components/schemas/SessionReview"
        importDiff:
          description: What the most recent import changed, when this response comes from a (re-)import call. Absent on plain reads.
          $ref: "#/components/schemas/ImportDiff"

    ImportDiffEntry:
      type: object
      required: [identity, ticker, category, direction]
      properties:
        identity:
          type: string
        ticker:
          type: string
        category:
          type: string
        direction:
          type: string
        market:
          type: ["string", "null"]

    ImportDiffFieldChange:
      allOf:
        - $ref: "#/components/schemas/ImportDiffEntry"
        - type: object
          required: [changes]
          properties:
            changes:
              type: array
              items:
                type: object
                required: [field, from, to]
                properties:
                  field:
                    type: string
                  from: {}
                  to: {}

    ImportDiff:
      type: object
      required: [added, updated, removed]
      description: Exactly what the last import added, changed (excluding preserved outcome fields), or removed as stale PENDING candidates.
      properties:
        added:
          type: array
          items:
            $ref: "#/components/schemas/ImportDiffEntry"
        updated:
          type: array
          items:
            $ref: "#/components/schemas/ImportDiffFieldChange"
        removed:
          type: array
          items:
            $ref: "#/components/schemas/ImportDiffEntry"

    CategoryStats:
      type: object
      required: [category, total, wins, losses, skips, pending, winRate]
      properties:
        category:
          type: string
          enum: [MOMENTUM, SQUEEZE, STUDS, WEAKEST]
        total:
          type: number
        wins:
          type: number
        losses:
          type: number
        skips:
          type: number
        pending:
          type: number
        winRate:
          type: ["number", "null"]
          description: Win rate as a fraction (0-1), null if no resolved trades

    QuoteResult:
      type: object
      required: [ticker, yahooTicker]
      properties:
        ticker:
          type: string
          description: Original screener ticker
        yahooTicker:
          type: string
          description: Yahoo Finance ticker (with .ST suffix)
        livePrice:
          type: ["number", "null"]
        change:
          type: ["number", "null"]
          description: Absolute price change from previous close
        changePct:
          type: ["number", "null"]
          description: Percent change from previous close
        marketState:
          type: ["string", "null"]
          description: REGULAR, PRE, POST, CLOSED
        asOf:
          type: ["string", "null"]
          format: date-time
          description: Timestamp of the underlying market price itself (Yahoo's regularMarketTime); can lag well behind fetchedAt outside market hours
        fetchedAt:
          type: string
          format: date-time
          description: Server time when this quote was fetched
        earningsDate:
          type: ["string", "null"]
          description: Next earnings date in YYYY-MM-DD format when Yahoo provides it
        earningsInDays:
          type: ["number", "null"]
          description: Calendar days until the next earnings date; negative means it has passed
        error:
          type: ["string", "null"]

    EquityCurvePoint:
      type: object
      required: [tradeIndex, cumulativeR, r, date, ticker, outcome]
      properties:
        tradeIndex:
          type: number
          description: Sequential trade number (1-based)
        cumulativeR:
          type: number
          description: Cumulative R-multiple after this trade
        r:
          type: number
          description: R-multiple for this individual trade
        date:
          type: string
          description: Session date (YYYY-MM-DD)
        ticker:
          type: string
        outcome:
          type: string
          enum: [WIN, LOSS]

    DashboardSummary:
      type: object
      required: [totalSessions, totalCandidates, resolvedTrades, wins, losses, overallWinRate, byCategory, avgRWin, avgRLoss, payoffRatio, expectedValue, equityCurve]
      properties:
        totalSessions:
          type: number
        totalCandidates:
          type: number
        resolvedTrades:
          type: number
        wins:
          type: number
        losses:
          type: number
        overallWinRate:
          type: ["number", "null"]
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryStats"
        avgRWin:
          type: ["number", "null"]
          description: Average R-multiple for winning trades
        avgRLoss:
          type: ["number", "null"]
          description: Average R-multiple for losing trades (negative)
        payoffRatio:
          type: ["number", "null"]
          description: avgRWin divided by absolute avgRLoss
        expectedValue:
          type: ["number", "null"]
          description: Expected R per trade (winRate * avgRWin + lossRate * avgRLoss)
        equityCurve:
          type: array
          description: Chronological sequence of resolved trades for equity curve chart
          items:
            $ref: "#/components/schemas/EquityCurvePoint"
